name: Register Discord Slash Commands

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check Discord secrets
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "❌ DISCORD_TOKEN is missing"
            exit 1
          fi

          if [ -z "$CLIENT_ID" ]; then
            echo "❌ CLIENT_ID is missing"
            exit 1
          fi

          if [ -z "$GUILD_ID" ]; then
            echo "❌ GUILD_ID is missing"
            exit 1
          fi

          echo "✅ DISCORD_TOKEN is available"
          echo "✅ CLIENT_ID is available"
          echo "✅ GUILD_ID is available"

      - name: Register slash commands
        run: npm run deploy
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
